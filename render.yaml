services:
  - type: web
    name: ticketsphere-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: python -m gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ticketsphere-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ticket-sphere-two.vercel.app"
      - key: BREVO_API_KEY
        sync: false

databases:
  - name: ticketsphere-db
    plan: free
    databaseName: ticketsphere
    user: ticketsphere
